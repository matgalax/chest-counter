<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffres">
<title>Compteur de coffres</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; -webkit-touch-callout: none; }
  body {
    font-family: -apple-system, sans-serif;
    background: linear-gradient(160deg, #1a1040, #3b1d7a);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 50px 20px 30px; user-select: none;
  }
  h1 { font-size: 22px; opacity: .85; }
  #partie { margin-top: 6px; opacity: .6; }
  #compteur { font-size: 120px; font-weight: 800; margin: 20px 0; color: #ffd84d; transition: transform .15s; }
  #compteur.pop { transform: scale(1.2); }
  #plus {
    width: 220px; height: 220px; border-radius: 50%; border: none;
    background: radial-gradient(circle, #ffd84d, #e0a800);
    font-size: 30px; font-weight: 800; color: #3b1d7a;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  #plus:active, .petit:active { transform: scale(.94); }
  .ligne { display: flex; gap: 12px; margin-top: 25px; }
  .petit {
    padding: 14px 20px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 600; color: #fff; background: rgba(255,255,255,.15);
  }
  .ajout { background: #e0a800; color: #3b1d7a; font-weight: 800; }
  #nouvelle { background: #2ecc71; }
  #micro { margin-top: 25px; padding: 14px 24px; border-radius: 30px; border: none; font-size: 17px; font-weight: 700; color: #fff; background: rgba(255,255,255,.15); }
  #micro.actif { background: #e74c3c; }
  #entendu { margin-top: 10px; font-size: 14px; opacity: .7; min-height: 18px; text-align: center; }
  .stats { display: flex; gap: 25px; margin-top: 30px; text-align: center; }
  .stats b { display: block; font-size: 26px; color: #ffd84d; }
  #historique { margin-top: 25px; width: 100%; max-width: 360px; font-size: 15px; }
  #historique div {
    display: flex; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.1);
  }
  #reset { margin-top: 25px; background: none; border: none; color: #ff7b7b; font-size: 14px; }
</style>
</head>
<body>
  <h1>🧰 Compteur de coffres</h1>
  <div id="partie">Partie n°1</div>
  <div id="compteur">0</div>
  <button id="plus">+1 COFFRE</button>

  <div class="ligne">
    <button class="petit ajout" data-n="5">+5</button>
    <button class="petit ajout" data-n="10">+10</button>
    <button class="petit ajout" data-n="20">+20</button>
  </div>

  <div class="ligne">
    <button class="petit" id="moins">−1</button>
    <button class="petit" id="nouvelle">Nouvelle partie ✓</button>
  </div>

  <button id="micro">🎤 Activer la voix</button>
  <div id="entendu"></div>

  <div class="stats">
    <div><b id="moyenne">0</b>Moyenne</div>
    <div><b id="record">0</b>Record</div>
    <div><b id="total">0</b>Total</div>
  </div>

  <div id="historique"></div>
  <button id="reset">Tout effacer</button>

<script>
  let data = JSON.parse(localStorage.getItem("coffres")) || { actuel: 0, parties: [] };

  function sauver() { localStorage.setItem("coffres", JSON.stringify(data)); }

  function afficher() {
    const p = data.parties;
    document.getElementById("compteur").textContent = data.actuel;
    document.getElementById("partie").textContent = "Partie n°" + (p.length + 1);
    const total = p.reduce((s, x) => s + x.coffres, 0);
    document.getElementById("total").textContent = total;
    document.getElementById("record").textContent = p.length ? Math.max(...p.map(x => x.coffres)) : 0;
    document.getElementById("moyenne").textContent = p.length ? (total / p.length).toFixed(1) : 0;
    document.getElementById("historique").innerHTML = p.slice().reverse().slice(0, 20).map((x, i) =>
      `<div><span>Partie ${p.length - i} · ${x.date}</span><span>${x.coffres} 🧰</span></div>`
    ).join("");
  }

  function pop() {
    const c = document.getElementById("compteur");
    c.classList.add("pop");
    setTimeout(() => c.classList.remove("pop"), 150);
  }

  function ajouter(n) {
    data.actuel = Math.max(0, data.actuel + n);
    if (navigator.vibrate) navigator.vibrate(30);
    sauver(); afficher(); pop();
  }

  function nouvellePartie() {
    const d = new Date();
    data.parties.push({
      coffres: data.actuel,
      date: d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    });
    data.actuel = 0;
    sauver(); afficher();
  }

  document.getElementById("plus").onclick = () => ajouter(1);
  document.querySelectorAll(".ajout").forEach(b => {
    b.onclick = () => ajouter(parseInt(b.dataset.n));
  });
  document.getElementById("moins").onclick = () => ajouter(-1);
  document.getElementById("nouvelle").onclick = nouvellePartie;

  document.getElementById("reset").onclick = () => {
    if (confirm("Effacer toutes les parties ?")) {
      data = { actuel: 0, parties: [] };
      sauver(); afficher();
    }
  };

  // ===== Nombres en lettres -> chiffres =====
  const valeurs = {
    zero: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9,
    dix: 10, onze: 11, douze: 12, treize: 13, quatorze: 14, quinze: 15, seize: 16,
    vingt: 20, vingts: 20, trente: 30, quarante: 40, cinquante: 50, soixante: 60,
    cent: 100, cents: 100, mille: 1000
  };

  function lireNombre(texte) {
    texte = texte.trim();
    if (/^\d+$/.test(texte)) return parseInt(texte);
    const mots = texte.split(/[\s-]+/).filter(m => m && m !== "et");
    if (!mots.length) return null;
    let total = 0, cur = 0;
    for (const m of mots) {
      const v = valeurs[m];
      if (v === undefined) return null;
      if (v === 1000) { total += (cur || 1) * 1000; cur = 0; }
      else if (v === 100) { cur = (cur || 1) * 100; }
      else if (v === 20 && cur % 100 === 4) { cur += 76; }   // quatre-vingt
      else { cur += v; }
    }
    return total + cur;
  }

  // ===== Commandes vocales =====
  const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
  const boutonMicro = document.getElementById("micro");
  const entendu = document.getElementById("entendu");
  let reco = null, ecoute = false;

  function analyser(texte) {
    let t = texte.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\+\s*(?=\d)/g, " plus ")
      .replace(/(^|\s)-\s*(?=\d)/g, " moins ");
    // "plus/moins" + nombre (chiffres ou lettres, jusqu'à 5 mots) + "coffre(s)"
    const regex = /(plus|moins)\s+([a-z0-9]+(?:[\s-]+[a-z0-9]+){0,4}?)\s+coffres?/g;
    let m;
    while ((m = regex.exec(t)) !== null) {
      const n = lireNombre(m[2]);
      if (n === null || n === 0) continue;
      ajouter(m[1] === "plus" ? n : -n);
      entendu.textContent = "✅ " + (m[1] === "plus" ? "+" : "−") + n + " coffre" + (n > 1 ? "s" : "");
    }
    if (/nouvelle partie/.test(t)) {
      nouvellePartie();
      entendu.textContent = "✅ nouvelle partie";
    }
  }

  function demarrer() {
    reco = new Reco();
    reco.lang = "fr-FR";
    reco.continuous = true;
    reco.interimResults = false;
    reco.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) analyser(e.results[i][0].transcript);
      }
    };
    reco.onend = () => { if (ecoute) try { reco.start(); } catch (_) {} };
    reco.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        entendu.textContent = "❌ Micro refusé : autorise-le dans les réglages du navigateur";
        arreter();
      }
    };
    reco.start();
  }

  function arreter() {
    ecoute = false;
    if (reco) reco.stop();
    boutonMicro.classList.remove("actif");
    boutonMicro.textContent = "🎤 Activer la voix";
  }

  boutonMicro.onclick = () => {
    if (!Reco) { entendu.textContent = "❌ La voix ne marche pas sur ce navigateur"; return; }
    if (ecoute) { arreter(); return; }
    ecoute = true;
    boutonMicro.classList.add("actif");
    boutonMicro.textContent = "🔴 J'écoute… (appuie pour arrêter)";
    entendu.textContent = "Dis « plus 18 coffres »";
    demarrer();
  };

  afficher();
</script>
</body>
</html>
